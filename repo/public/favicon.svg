<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="gapGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06B6D4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="128" fill="#090D16"/>
  <rect width="512" height="512" rx="128" fill="url(#gapGradient)" opacity="0.05"/>

  <!-- Outer Ring -->
  <rect x="32" y="32" width="448" height="448" rx="96" stroke="url(#gapGradient)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Chat Bubble Group -->
  <g filter="url(#shadow)">
    <!-- Main Bubble -->
    <path d="M120 160C120 137.909 137.909 120 160 120H352C374.091 120 392 137.909 392 160V296C392 318.091 374.091 336 352 336H240L160 392V336H160C137.909 336 120 318.091 120 296V160Z" fill="url(#gapGradient)"/>
    
    <!-- Inner Accent Lightning/Gap icon -->
    <path d="M260 170L210 248H256L240 300L290 222H244L260 170Z" fill="#FFFFFF"/>
  </g>

  <!-- Glowing dots representing active users -->
  <circle cx="360" cy="160" r="14" fill="#10B981"/>
  <circle cx="360" cy="160" r="22" stroke="#10B981" stroke-width="4" stroke-opacity="0.4"/>
</svg>