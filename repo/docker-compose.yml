version: '3.8'

services:
  chat-app:
    build: .
    container_name: antigravity-chat-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=production-secret-token-key-2026-antigravity
      - MONGODB_URI=mongodb://mongodb-container:27017/ephemeral_chat
    depends_on:
      - mongodb-container
    restart: always

  mongodb-container:
    image: mongo:latest
    container_name: antigravity-chat-db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_storage:/data/db
    restart: always

volumes:
  mongodb_storage:
